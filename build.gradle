//file:noinspection GroovyAssignabilityCheck
import me.modmuss50.mpp.ReleaseType

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

def secretProperties = new Properties()
def secretPropertiesFile = rootProject.file("secret.properties")
if (secretPropertiesFile.exists()) {
    secretProperties.load(secretPropertiesFile.newInputStream())
}

publishMods {
    def modrinthToken = secretProperties.getProperty("MODRINTH_TOKEN")
    def curseforgeToken = secretProperties.getProperty("CURSEFORGE_TOKEN")
    def githubToken = secretProperties.getProperty("GITHUB_TOKEN")
    def fullVersion = "v" + project.version + "+" + project.minecraft_version

    file = jar.archiveFile

    displayName = project.mod_name + fullVersion
    version = fullVersion
    type = ReleaseType.valueOf(project.stability)
    changelog = "# Version " + fullVersion +
            "\n\n" + project.file("CHANGELOG.md").getText()

    modLoaders.add("fabric")

    curseforge {
        accessToken = curseforgeToken
        projectId = project.curseforge_id
        projectSlug = project.curseforge_slug
        minecraftVersions.add(project.minecraft_version)

        requires("fabric-api")
        requires("owo-lib")
        optional("modmenu")
        optional("serene-seasons")
        incompatible("tough-as-nails")

        client = true
        server = true
    }

    modrinth {
        accessToken = modrinthToken
        projectId = project.modrinth_id
        minecraftVersions.add(project.minecraft_version)

        requires("fabric-api")
        requires("owo-lib")
        optional("modmenu")
        optional("serene-seasons")
        incompatible("tough-as-nails")
    }

    github {
        accessToken = githubToken
        repository = project.github_repo
        tagName = "release/v" + project.version + "+" + project.minecraft_version
        commitish = "master"
        allowEmptyFiles = true
    }
}

loom {
    def aw = project.file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Minecraft Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Minecraft Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url 'https://maven.wispforest.io/releases/' }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation("com.terraformersmc:modmenu:${modmenu_version}")
    annotationProcessor implementation("io.wispforest:owo-lib:${owo_version}")
    include "io.wispforest:owo-sentinel:${owo_version}"

    // Soft-dependencies
    compileOnly "com.electronwill.night-config:toml:${nightconfig_version}"
    compileOnly "com.electronwill.night-config:core:${nightconfig_version}"
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    compileOnly "maven.modrinth:glitchcore:${glitchcore_version}"
    compileOnly "net.jodah:typetools:0.6.3"
}

fabricApi {
    configureDataGeneration() {
        client = true

    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'stability'                    : stability,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'owo_version'    : owo_version,
            'modmenu_version': modmenu_version,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'java_version'                 : java_version,
            'curseforge_slug'              : curseforge_slug,
            'curseforge_id'                : curseforge_id,
            'modrinth_slug'                : modrinth_slug,
            'modrinth_id'                  : modrinth_id,
            'github_repo'                  : github_repo,
            'discord_invite'               : discord_invite
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = project.archives_base_name
    version = project.version + "+" + project.minecraft_version
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : version,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Build-On-Minecraft'      : minecraft_version
        ])
    }

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {

    }
}